<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Bike Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Librairies -->
  <script src="libs/plotly.min.js"></script>
  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
  <script src="libs/DRACOLoader.js"></script>
  <!-- JSZip for creating ZIP files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Ton style -->
  <link rel="stylesheet" href="style.css" />

  <!-- Scripts principaux -->
  <script defer src="index.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <!-- Topbar: sticky header -->
    <header class="topbar">
      <div class="topbar-brand">
        <img src="images/logo.png" alt="logo" class="brand-logo" />
        <span class="brand-name">Smart Bike</span>
      </div>
      
      <div class="topbar-controls">
        <div class="control-group">
          <label class="control-label">
            <input type="checkbox" id="live_data_toggle" checked />
            <span data-i18n="live_data">Live Data</span>
          </label>
        </div>
        <div id="run_selector_container" class="control-group" style="display: none;">
          <label for="run_selector" data-i18n="select_run">Select Run:</label>
          <select id="run_selector" class="select">
            <option value="" data-i18n="no_run_selected">-- No run selected --</option>
          </select>
        </div>
        <div class="control-group">
          <span data-i18n="active_profile_label">Profile:</span>
          <strong id="active_profile_name" class="profile-name">--</strong>
        </div>
        <button id="btn_run_control" class="btn" style="display:none" data-i18n="start_run">Start run</button>
        <button id="btn_replay_csv" class="btn" style="display:none" data-i18n="replay_run">Replay</button>
        <button id="btn_clear_chart" class="btn" data-i18n="clear_chart">Clear chart</button>
      </div>
      
      <div class="topbar-actions">
        <button id="btn_profile" class="btn btn-icon" title="Profile" aria-label="Profile" data-i18n="profile_title">
          Profile
        </button>
        <button id="btn_settings" class="btn btn-icon" title="Settings" aria-label="Settings" data-i18n="settings_title">
          Settings
        </button>
      </div>
    </header>

    <!-- Main dashboard grid -->
    <main class="dashboard-main">
      <div class="dashboard-grid">
        <section class="dashboard-card" id="handlebar_card">
          <div class="heatmap-legend">
            <span id="legend_min" class="legend-label">0</span>
            <div class="legend-gradient"></div>
            <span id="legend_max" class="legend-label">0</span>
          </div>
          <div class="card-content">
            <div id="handlebar_container" class="three-container"></div>
          </div>
        </section>

        <section class="dashboard-card" id="three_card">
          <div class="card-content">
            <div id="three_container" class="three-container"></div>
          </div>
        </section>

        <section class="dashboard-card" id="chart_pressure_left_card">
          <h2 class="card-title" data-i18n="left_handle">Left</h2>
          <div class="card-content">
            <div id="pressure_chart_left" class="chart"></div>
          </div>
        </section>

        <section class="dashboard-card" id="chart_pressure_right_card">
          <h2 class="card-title" data-i18n="right_handle">Right</h2>
          <div class="card-content">
            <div id="pressure_chart_right" class="chart"></div>
          </div>
        </section>

        <section class="dashboard-card" id="corr_card" style="display: none;">
          <h2 class="card-title" data-i18n="correlation_matrix">Correlation Matrix</h2>
          <div class="card-content">
            <div id="corr_matrix" class="chart"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

    <!-- Profile Modal -->
    <div id="profile_modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="profile_title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="profile_title" data-i18n="profile_title">Profile</h3>
          <button id="profile_close" class="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="controls-row">
            <label for="profile_select" data-i18n="active_profile">Active profile</label>
            <select id="profile_select" class="select" style="min-width:180px"></select>
            <span id="active_profile_indicator" style="color:#28a745;font-weight:bold;margin-left:8px;"></span>
            <button id="btn_set_active" class="btn" data-i18n="set_active">Set Active</button>
            <input id="new_runner_name" class="select" data-i18n-placeholder="new_runner_placeholder" placeholder="New runner name" style="width:180px;margin-left:12px" />
            <button id="btn_create_runner" class="btn" data-i18n="create_runner">Create</button>
          </div>
          <div class="controls-row">
            <div style="flex:1">
              <h4 data-i18n="unsorted_runs">Unsorted runs</h4>
              <select id="unsorted_list" size="8" multiple class="select" style="width:100%"></select>
              <div style="margin-top:8px;display:flex;gap:8px">
                <button id="btn_delete_unsorted_run" class="btn" data-i18n="delete_run" style="background:#dc3545">Delete</button>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;padding:0 12px;gap:8px">
              <button id="btn_move_selected" class="btn" data-i18n="move_to_profile">→ Move to profile</button>
              <button id="btn_move_to_unsorted" class="btn" data-i18n="move_to_unsorted">← Move to unsorted</button>
            </div>
            <div style="flex:1">
              <h4 data-i18n="profile_runs">Profile runs</h4>
              <select id="profile_runs_list" size="8" multiple class="select" style="width:100%"></select>
              <div style="margin-top:8px;display:flex;gap:8px">
                <input id="rename_run_input" class="select" data-i18n-placeholder="rename_placeholder" placeholder="New name" style="flex:1" />
                <button id="btn_rename_profile_run" class="btn" data-i18n="rename_run">Rename</button>
                <button id="btn_download_profile_run" class="btn" data-i18n="download_run" style="background:#28a745">Download</button>
                <button id="btn_delete_profile_run" class="btn" data-i18n="delete_run" style="background:#dc3545">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings_modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings_title">
      <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
          <h3 id="settings_title" data-i18n="settings_title">Settings</h3>
          <button id="settings_close" class="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="settings-section">
            <h4 data-i18n="theme_label">Theme</h4>
            <div class="settings-row">
              <label data-i18n="light_mode">Light Mode</label>
              <input type="radio" name="theme" value="light" id="theme_light" class="theme-radio" />
            </div>
            <div class="settings-row">
              <label data-i18n="dark_mode">Dark Mode</label>
              <input type="radio" name="theme" value="dark" id="theme_dark" class="theme-radio" />
            </div>
          </div>

          <div class="settings-section">
            <h4 data-i18n="language_label">Language</h4>
            <div class="settings-row">
              <button class="lang-btn-settings" data-lang="en">English</button>
              <button class="lang-btn-settings" data-lang="fr">Français</button>
              <button class="lang-btn-settings" data-lang="de">Deutsch</button>
            </div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
