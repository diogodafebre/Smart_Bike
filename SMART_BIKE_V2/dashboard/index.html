<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Bike Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Librairies -->
  <script src="libs/plotly.min.js"></script>
  <script src="libs/three.min.js"></script>
  <script src="libs/GLTFLoader.js"></script>
  <script src="libs/DRACOLoader.js"></script>
  <!-- JSZip for creating ZIP files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Ton style -->
  <link rel="stylesheet" href="style.css" />

  <!-- Scripts principaux -->
  <script defer src="index.js"></script>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <img src="images/logo.png" alt="logo" />
        <span>Smart Bike</span>
      </div>
      
      <!-- Chart control buttons moved to header -->
      <div class="chart-controls">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
              <input type="checkbox" id="live_data_toggle" checked />
              <span data-i18n="live_data">Live Data</span>
            </label>
          </div>
          <div id="run_selector_container" style="display: none;">
            <label for="run_selector" style="margin-right: 4px;" data-i18n="select_run">Select Run:</label>
            <select id="run_selector" class="select" style="min-width: 200px;">
              <option value="" data-i18n="no_run_selected">-- No run selected --</option>
            </select>
          </div>
          <div style="color: var(--text-secondary); font-size: 0.9em;">
            <span data-i18n="active_profile_label">Profile:</span>
            <strong id="active_profile_name" style="color: var(--accent);">--</strong>
          </div>
        </div>
        <button id="btn_clear_chart" class="btn" data-i18n="clear_chart">Clear chart</button>
      </div>
      
      <div class="topbar-actions">
        <div class="theme-toggler">
          <span class="active">☀️</span>
          <span>🌙</span>
        </div>
        <div class="lang-switch" role="group" aria-label="Language">
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="de">DE</button>
        </div>
        <button id="btn_profile" class="btn" style="margin-left:8px" data-i18n="profile_settings">Profile / Settings</button>
      </div>
    </header>

    <main>
      

      <div id="dashboard_grid" class="quad-grid">
        <div class="chart-card quad" id="handlebar_card">
          <h2 data-i18n="handlebar_pressure">Handlebar Pressure Heatmap</h2>
          <div class="heatmap-legend">
            <span id="legend_min" class="legend-label">0</span>
            <div class="legend-gradient"></div>
            <span id="legend_max" class="legend-label">0</span>
          </div>
          <div id="handlebar_container" class="three-container"></div>
        </div>

        <div class="chart-card quad" id="three_card">
          <h2 data-i18n="bike_3d">3D Bike</h2>
          <div id="three_container" class="three-container"></div>
        </div>

        <div class="chart-card quad" id="chart_pressure_left_card">
          <h2 data-i18n="left_handle">Left Handle (Sensors 5-8)</h2>
          <div id="pressure_chart_left" class="chart"></div>
        </div>

        <div class="chart-card quad" id="chart_pressure_right_card">
          <h2 data-i18n="right_handle">Right Handle (Sensors 1-4)</h2>
          <div id="pressure_chart_right" class="chart"></div>
        </div>        

        <div class="chart-card quad" id="corr_card" style="display: none;">
          <h2 data-i18n="correlation_matrix">Correlation Matrix</h2>
          <div id="corr_matrix" class="chart"></div>
        </div>
      </div>

      </main>
    </div>

    <!-- Profile / Settings Modal -->
    <div id="profile_modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="profile_title">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="profile_title" data-i18n="profile_title">Profile & Sorting</h3>
          <button id="profile_close" class="modal-close" aria-label="Close">×</button>
        </div>
        <div class="modal-body">
          <div class="controls-row">
            <label for="profile_select" data-i18n="active_profile">Active profile</label>
            <select id="profile_select" class="select" style="min-width:180px"></select>
            <span id="active_profile_indicator" style="color:#28a745;font-weight:bold;margin-left:8px;"></span>
            <button id="btn_set_active" class="btn" data-i18n="set_active">Set Active</button>
            <input id="new_runner_name" class="select" data-i18n-placeholder="new_runner_placeholder" placeholder="New runner name" style="width:180px;margin-left:12px" />
            <button id="btn_create_runner" class="btn" data-i18n="create_runner">Create</button>
          </div>
          <div class="controls-row">
            <div style="flex:1">
              <h4 data-i18n="unsorted_runs">Unsorted runs</h4>
              <select id="unsorted_list" size="8" multiple class="select" style="width:100%"></select>
              <div style="margin-top:8px;display:flex;gap:8px">
                <button id="btn_delete_unsorted_run" class="btn" data-i18n="delete_run" style="background:#dc3545">Delete</button>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;padding:0 12px;gap:8px">
              <button id="btn_move_selected" class="btn" data-i18n="move_to_profile">→ Move to profile</button>
              <button id="btn_move_to_unsorted" class="btn" data-i18n="move_to_unsorted">← Move to unsorted</button>
            </div>
            <div style="flex:1">
              <h4 data-i18n="profile_runs">Profile runs</h4>
              <select id="profile_runs_list" size="8" multiple class="select" style="width:100%"></select>
              <div style="margin-top:8px;display:flex;gap:8px">
                <input id="rename_run_input" class="select" data-i18n-placeholder="rename_placeholder" placeholder="New name" style="flex:1" />
                <button id="btn_rename_profile_run" class="btn" data-i18n="rename_run">Rename</button>
                <button id="btn_download_profile_run" class="btn" data-i18n="download_run" style="background:#28a745">Download</button>
                <button id="btn_delete_profile_run" class="btn" data-i18n="delete_run" style="background:#dc3545">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
